[project]
name = "sales-intel-backend"
version = "0.1.0"
description = "AI-powered sales intelligence platform backend (FastAPI + LangGraph + CockroachDB)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "sqlalchemy-cockroachdb>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

# The backend runs modules via pythonpath (see pytest/ruff below); it is not
# itself an installable distribution, so disable package auto-discovery.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008 fires on FastAPI's idiomatic Depends()/Query() in argument defaults,
# which is the sanctioned pattern — allow it.
ignore = ["B008"]
